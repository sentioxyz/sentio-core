syntax = "proto3";

// The subset of housegate/rewriter-proto (v0.6.0, proto/rewriter.proto) that
// the static-mode client in service/analytic/clients/rewriter sends and reads.
// Field numbers and enum values are copied unchanged, so messages are
// wire-compatible with housegate/rewriter.
//
// The upstream file declares `package rewriter`, the same package as
// ../protos/rewriter.proto (the sql-rewriter contract). Both cannot be
// registered in one binary, so this copy uses its own package and the client
// calls the upstream method paths (/rewriter.RewriterService/...) directly.
// There is no service definition here for that reason.
package housegate.rewriter;
option go_package = "sentioxyz/sentio-core/service/rewriter/housegate";

enum RewriteOp {
    TableNameRewrite = 0;
    LimitRewrite = 1;
    OffsetRewrite = 2;
    SettingsRewrite = 3;
    CommonTableExprRewrite = 4;
}

message RewriteLimitArgs {
    message ReplaceLimit {
        int32 threshold = 1;
        int32 replace_to = 2;
    }
    oneof value {
        ReplaceLimit replace_limit = 2;
        int32 force_limit = 3;
    }
}

message RewriteOffsetArgs {
    int32 offset = 1;
}

message RewriteCommonTableExprArgs {
    message CommonTableExpr {
        string alias = 1;
        string sql = 2;
    }
    map<string, CommonTableExpr> cte_map = 1;
}

// Static-mode table arguments; fields 1-3 match the sql-rewriter
// RewriteTableNameArgs.
message RewriteTableStaticArgs {
    message RemoteTable {
        string addr = 1;
        string database = 2;
        string table = 3;
        string user = 4;
        string password = 5;
    }
    message TableWithDatabase {
        string database = 1;
        string table = 2;
    }
    map<string, string> table_map = 1;
    map<string, RemoteTable> remote_table_map = 2;
    map<string, TableWithDatabase> table_with_database_map = 3;
}

message RewriteTableNameArgs {
    // dynamic_args (RewriteTableDynamicArgs) is HouseGate's mode; not used here.
    reserved 1;
    optional RewriteTableStaticArgs static_args = 2;
}

enum SettingType {
    String = 0;
    Bool = 1;
    Int = 2;
    Uint64 = 3;
}

message RewriteSettingsArgs {
    message Setting {
        string key = 1;
        SettingType type = 2;
        oneof value {
            string string_value = 3;
            bool bool_value = 4;
            int32 int_value = 5;
            uint64 uint64_value = 6;
        }
    }
    repeated Setting settings = 1;
}

message RewriteOption {
    RewriteOp op = 1;
    oneof value {
        RewriteTableNameArgs table_name_args = 2;
        RewriteLimitArgs limit_args = 3;
        RewriteOffsetArgs offset_args = 4;
        RewriteSettingsArgs settings_args = 5;
        RewriteCommonTableExprArgs common_table_expr_args = 6;
    }
}

message RewriteSQLRequest {
    string sql = 1;
    repeated RewriteOption options = 2;
    // Refuse statements that read ClickHouse metadata (system /
    // information_schema, SHOW, version(), deployment-identity calls, ...),
    // as sql-rewriter always did. The server acknowledges it in
    // RewriteSQLResponse.metadata_access_refusal_applied.
    bool refuse_metadata_access = 3;
}

enum RewriteCode {
    Success = 0;
    SyntaxError = 1;
    RewriteError = 2;
    UnsupportedStatement = 3;
    InvalidRewriteRequest = 4;
}

message RewriteSQLResponse {
    RewriteCode code = 1;
    string message = 2;
    string sql_after_rewrite = 3;
    reserved 4;
    // Fields 5-16 are not read by this client.
    bool metadata_access_refusal_applied = 17;
}

message RewriteErrorMessageRequest {
    string sql = 1;
    string error_message = 2;
    repeated RewriteOption options = 3;
}

message RewriteErrorMessageResponse {
    RewriteCode code = 1;
    string message = 2;
    string error_after_rewrite = 3;
}
